<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Origem Assist{% endblock %}</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
 
<body class="bg-light">
 
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            🚨 Origem Assist
        </span>
    </div>

<!-- Exemplo de como deves colocar na tua navbar no base.html -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{% url 'home' %}" class="navbar-brand mb-0 h1 text-decoration-none">
            🚨 Origem Assist
        </a>

        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-3">
            <span class="text-white fw-bold">👤 {{ user.username }}</span>
            <form method="POST" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>
 
<div class="container mt-5">
 
    {% block content %}
 
    {% endblock %}
 
</div>
 
</body>
</html>
